# Production profile (Render / Neon). Activate with SPRING_PROFILES_ACTIVE=prod

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=INFO
logging.level.com.lms=INFO
spring.jpa.show-sql=false

# UTC for persistence and JSON serialization
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Conservative pool for ~512 MB instances
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Require explicit cloud targets; never fall back to local development resources.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
